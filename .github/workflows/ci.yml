name: CI

on: [push, pull_request]

jobs:
  test:
    name: lint + bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout (with bats-core submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install shellcheck
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install shellcheck
          else
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi

      - name: Lint shell scripts
        shell: bash
        run: |
          shellcheck -S warning \
            skills/catchup/scripts/*.sh \
            skills/review-deps-prs/scripts/*.sh \
            dev/bin/release \
            tests/helpers/common.bash \
            tests/helpers/stubs/gh
          # .bats files use --shell=bash because shellcheck has no native bats mode
          shellcheck --shell=bash -S warning tests/*.bats

      - name: Run bats suite
        shell: bash
        run: tests/lib/bats-core/bin/bats tests/
